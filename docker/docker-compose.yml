name: feishu-bot

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    env_file:
      - ../.env
    environment:
      DEFAULT_CWD: /app
      DATA_DIR: /data
      CONTACTS_FILE: /data/contacts.md
      TASKS_FILE: /data/tasks.json
      CODEX_HOME: /data/codex-home
    volumes:
      - app-outputs:/app/outputs
      - app-logs:/app/logs
      - bot-home:/root/.feishu-bot
      - bot-data:/data
    restart: unless-stopped

volumes:
  app-outputs:
  app-logs:
  bot-home:
  bot-data:
