name: feishu-bot

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    env_file:
      - ../.env
    environment:
      DATA_DIR: /data
      CONTACTS_FILE: /data/contacts.md
    volumes:
      - app-outputs:/app/outputs
      - app-logs:/app/logs
      - bot-home:/root/.feishu-bot
      - bot-data:/data
      - ../.secrets/zhipu.key:/run/secrets/zhipu_key:ro
    restart: unless-stopped

volumes:
  app-outputs:
  app-logs:
  bot-home:
  bot-data:
